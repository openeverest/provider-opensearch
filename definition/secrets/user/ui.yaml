# Create form of the user Secret, opened from the "Admin credentials" field.
# Paths are keys of the Secret's data.
label: "Admin credentials"
description: "Initial password of the OpenSearch admin user."
components:
  password:
    uiType: text
    path: password
    fieldParams:
      label: "Admin password"
      type: password
    validation:
      required: true
componentsOrder:
  - password
