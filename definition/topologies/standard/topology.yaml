# Standard topology definition.
# A single node pool where every OpenSearch node is cluster-manager eligible,
# holds data and runs ingest pipelines.
#
# config.components: Which components are used and their defaults.
# ui: Rendering hints for the frontend form.
#
# See github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md
# for detailed guidance.

config:
  components:
    engine:
      defaults:
        replicas: 3
      # Only the fields the provider maps onto the OpenSearchCluster node pool.
      supportedFields:
        required: [storage]
        properties:
          storage: {}
          resources: {}
          replicas: {minimum: 1}
          # schedulerName is omitted: OpenSearchCluster node pools cannot set it.
          schedulingPolicy:
            properties:
              affinity: {}
              nodeSelector: {}
              tolerations: {}
              topologySpreadConstraints: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Provide the information about the OpenSearch version you want to use."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "OpenSearch Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            modes:
              edit:
                disabled: true
              restore:
                disabled: true
          validation:
            required: true
    resources:
      label: "Resources"
      description: "Configure the resources your OpenSearch cluster will have access to."
      components:
        nodes:
          uiType: group
          components:
            numberOfNodes:
              path: "spec.components.engine.replicas"
              uiType: number
              fieldParams:
                label: "Number of nodes"
                defaultValue: 3
              validation:
                required: true
                min: 1
                int: true
                modes:
                  edit:
                    celExpressions:
                      - celExpr: "!(spec.components.engine.replicas == 1 && original.spec.components.engine.replicas > 1)"
                        message: "Cannot scale down to a single node"
            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.engine.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 1
                    step: 0.5
                  validation:
                    min: 0.5
                    required: true
                memory:
                  path: "spec.components.engine.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 4
                    step: 0.5
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 2
                    required: true
                disk:
                  path: "spec.components.engine.storage.size"
                  uiType: number
                  fieldParams:
                    label: "Disk"
                    defaultValue: 25
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 1
                    int: true
                    required: true
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: "spec.components.engine.storage.size >= original.spec.components.engine.storage.size"
                            message: "Disk size cannot be decreased"
          componentsOrder:
            - numberOfNodes
            - resources
    advanced:
      label: "Advanced configuration"
      description: "Configure advanced settings for your OpenSearch cluster"
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            modes:
              edit:
                disabled: true
              restore:
                disabled: true
          validation:
            required: true
          dataSource:
            provider: storageClasses
  sectionsOrder:
    - databaseVersion
    - resources
    - advanced
