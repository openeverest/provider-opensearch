# Standard topology definition.
# A single node pool where every OpenSearch node is cluster-manager eligible,
# holds data and runs ingest pipelines.
#
# config.components: Which components are used and their defaults.
# ui: Rendering hints for the frontend form.
#
# See github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md
# for detailed guidance.

config:
  components:
    engine:
      defaults:
        replicas: 3
      # Only the fields the provider maps onto the OpenSearchCluster node pool.
      supportedFields:
        required: [storage]
        properties:
          storage: {}
          resources: {}
          replicas: {minimum: 1}
          service: {}
          # schedulerName is omitted: OpenSearchCluster node pools cannot set it.
          schedulingPolicy:
            properties:
              affinity: {}
              nodeSelector: {}
              tolerations: {}
              topologySpreadConstraints: {}
    dashboards:
      optional: true
      defaults:
        replicas: 1
      # Dashboards is stateless: no storage field, unlike engine.
      supportedFields:
        properties:
          resources: {}
          replicas: {minimum: 1}
          service: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Provide the information about the OpenSearch version you want to use."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "OpenSearch Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            modes:
              restore:
                disabled: true
          validation:
            required: true
        userSecret:
          uiType: secret
          path: spec.userSecretRef.name
          fieldParams:
            label: "Admin credentials"
            definition: user
            helperText: "Leave empty to generate the admin password."
            modes:
              edit:
                readOnly: true
                helperText: "Set when the database is created."
      componentsOrder:
        - version
        - userSecret
    resources:
      label: "Resources"
      description: "Configure the resources your OpenSearch cluster will have access to."
      components:
        nodes:
          uiType: group
          components:
            numberOfNodes:
              path: "spec.components.engine.replicas"
              uiType: number
              fieldParams:
                label: "Number of nodes"
                defaultValue: 3
              validation:
                required: true
                min: 1
                int: true
                modes:
                  edit:
                    celExpressions:
                      - celExpr: "!(spec.components.engine.replicas == 1 && original.spec.components.engine.replicas > 1)"
                        message: "Cannot scale down to a single node"
            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.engine.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 1
                    step: 0.5
                  validation:
                    min: 0.5
                    required: true
                memory:
                  path: "spec.components.engine.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 4
                    step: 0.5
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 2
                    required: true
                disk:
                  path: "spec.components.engine.storage.size"
                  uiType: number
                  fieldParams:
                    label: "Disk"
                    defaultValue: 25
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 1
                    int: true
                    required: true
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: "spec.components.engine.storage.size >= original.spec.components.engine.storage.size"
                            message: "Disk size cannot be decreased"
          componentsOrder:
            - numberOfNodes
            - resources
    tls:
      label: "TLS"
      description: "Connections are always encrypted. Leave empty to use a certificate generated for the instance."
      components:
        certificateSecretName:
          uiType: text
          path: spec.parameters.tls.certificateSecretName
          fieldParams:
            label: "Certificate secret"
            helperText: "Secret with tls.crt, a PKCS#8 tls.key and ca.crt for the address clients connect to"
            modes:
              edit:
                disabled: true
          validation:
            celExpressions:
              - celExpr: "!has(spec.parameters.tls.certificateSecretName) || spec.parameters.tls.certificateSecretName == '' || !has(spec.parameters.tls.issuer.name) || spec.parameters.tls.issuer.name == ''"
                message: "Use either a certificate secret or an issuer, not both"
        issuer:
          uiType: group
          groupType: line
          components:
            issuerName:
              uiType: text
              path: spec.parameters.tls.issuer.name
              fieldParams:
                label: "cert-manager issuer"
                helperText: "Issuer that signs the certificate"
                modes:
                  edit:
                    disabled: true
            issuerKind:
              uiType: select
              path: spec.parameters.tls.issuer.kind
              fieldParams:
                label: "Issuer kind"
                defaultValue: "Issuer"
                options:
                  - label: "Issuer"
                    value: "Issuer"
                  - label: "ClusterIssuer"
                    value: "ClusterIssuer"
                modes:
                  edit:
                    disabled: true
          componentsOrder:
            - issuerName
            - issuerKind
      componentsOrder:
        - certificateSecretName
        - issuer
    advanced:
      label: "Advanced configuration"
      description: "Configure advanced settings for your OpenSearch cluster"
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            modes:
              edit:
                disabled: true
              restore:
                disabled: true
          validation:
            required: true
          dataSource:
            provider: storageClasses
        configuration:
          uiType: text
          path: spec.components.engine.parameters.configuration
          fieldParams:
            label: "opensearch.yml"
            placeholder: |2
              cluster.routing.allocation.disk.threshold_enabled: false
            multiline: true
            minRows: 3
            maxRows: 8
        externalAccess:
          uiType: select
          path: spec.components.engine.service.serviceType
          fieldParams:
            label: "External access"
            defaultValue: "ClusterIP"
            options:
              - label: "ClusterIP"
                value: "ClusterIP"
              - label: "LoadBalancer"
                value: "LoadBalancer"
              - label: "NodePort"
                value: "NodePort"
            # TODO: Support Service annotation and LoadBalancer source ranges configuration
            # https://github.com/openeverest/openeverest/issues/1959
            # https://github.com/openeverest/openeverest/issues/2398
      componentsOrder:
        - storageClass
        - configuration
        - externalAccess
  sectionsOrder:
    - databaseVersion
    - resources
    - tls
    - advanced
