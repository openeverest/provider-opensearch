# Provider identity and component definitions.
# Edit this file to add or remove components.
# Run `make generate` after making changes.

name: opensearch

# engine: OpenSearch nodes. In the standard topology every node is
# cluster-manager eligible and holds data.
# dashboards: optional OpenSearch Dashboards deployment, managed by the
# operator as part of the same OpenSearchCluster.
components:
  engine:
    type: opensearch
    parametersSchema: OpensearchParameters
  dashboards:
    type: dashboards
