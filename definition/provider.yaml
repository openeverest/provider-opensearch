# Provider identity and component definitions.
# Edit this file to add or remove components.
# Run `make generate` after making changes.

name: opensearch

# Instance-wide parameters (Instance.spec.parameters), a Go type in
# definition/types.go.
parametersSchema: Parameters

# engine: OpenSearch nodes. In the standard topology every node is
# cluster-manager eligible and holds data; in the dedicated topology these are
# the data nodes.
# clusterManager, coordinator: the dedicated topology's cluster-manager and
# coordinating-only nodes.
# dashboards: optional OpenSearch Dashboards deployment, managed by the
# operator as part of the same OpenSearchCluster.
components:
  engine:
    type: opensearch
    parametersSchema: OpensearchParameters
  clusterManager:
    type: opensearch
    parametersSchema: OpensearchParameters
  coordinator:
    type: opensearch
    parametersSchema: OpensearchParameters
  dashboards:
    type: dashboards

# The kind of each component type classifies the software for monitoring
# classes and the UI (an OpenTelemetry db.system.name value). Every type
# definition/monitoring.yaml lists needs one.
componentTypes:
  opensearch:
    kind: opensearch
