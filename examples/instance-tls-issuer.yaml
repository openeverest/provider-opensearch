# Instance whose HTTP certificate is signed by your own CA through a
# cert-manager ClusterIssuer, valid for an external name as well. Create the
# ClusterIssuer first (see README, "Bring your own CA"), and point
# search.example.com at the <name>-exposed LoadBalancer.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: opensearch-tls
spec:
  providerRef:
    name: opensearch
  parameters:
    tls:
      issuer:
        name: company-ca
        kind: ClusterIssuer
        # group: awspca.cert-manager.io  # for an external issuer, with its kind
      additionalNames:
        - search.example.com
  components:
    engine:
      replicas: 3
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      storage:
        size: 50Gi
      service:
        serviceType: LoadBalancer
