apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
spec:
  deletionPolicy: Orphan
status:
  (length(pendingMaintenance)): 1
  pendingMaintenance:
    - severity: RollingRestart
      (starts_with(approvalToken, 'provider-')): true
  (conditions[?type == 'MaintenancePending']):
    - status: "True"
