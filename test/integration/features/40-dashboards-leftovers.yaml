# What the operator creates for Dashboards and never removes once disabled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-instance-dashboards-config
---
apiVersion: v1
kind: Service
metadata:
  name: test-instance-dashboards
spec:
  ports:
    - port: 5601
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-instance-dashboards
spec:
  replicas: 0
  selector:
    matchLabels:
      app: test-instance-dashboards
  template:
    metadata:
      labels:
        app: test-instance-dashboards
    spec:
      containers:
        - name: dashboards
          image: opensearchproject/opensearch-dashboards:3.7.0
