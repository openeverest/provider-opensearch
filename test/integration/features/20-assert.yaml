# The connection details point at the address the LoadBalancer was given,
# and Dashboards is enabled now that the cluster is initialized.
apiVersion: opensearch.org/v1
kind: OpenSearchCluster
metadata:
  name: test-instance
spec:
  dashboards:
    enable: true
    version: 3.7.0
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
status:
  phase: Provisioned
  (conditions[?type == 'Ready'].status | [0]): "True"
---
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-conn
data:
  host: MjAzLjAuMTEzLjc=  # 203.0.113.7
  port: OTIwMA==          # 9200
