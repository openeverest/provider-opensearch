# The OpenSearchCluster Sync() must produce for 10-create-instance.yaml: one
# node pool per role. Arrays are matched element by element, so the pool list
# is exact.
apiVersion: opensearch.org/v1
kind: OpenSearchCluster
metadata:
  name: test-instance
spec:
  general:
    serviceName: test-instance
  security:
    tls:
      http:
        generate: true
        (customFQDN == join('', ['test-instance-client.', $namespace, '.svc'])): true
  nodePools:
    - component: managers
      replicas: 3
      diskSize: 5Gi
      roles:
        - cluster_manager
      (additionalConfig == null): true
      pdb:
        enable: true
        maxUnavailable: 1
    - component: data
      replicas: 2
      diskSize: 10Gi
      roles:
        - data
        - ingest
      additionalConfig:
        indices.query.bool.max_clause_count: "2048"
    - component: coordinators
      replicas: 2
      (length(roles)): 0
      persistence:
        emptyDir: {}
      pdb:
        enable: true
        maxUnavailable: 1
---
apiVersion: v1
kind: Service
metadata:
  name: test-instance-client
spec:
  type: ClusterIP
  selector:
    opensearch.org/opensearch-cluster: test-instance
    opensearch.org/opensearch-nodepool: coordinators
  ports:
    - name: http
      port: 9200
