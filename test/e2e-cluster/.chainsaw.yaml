---
# Chainsaw configuration shared by all e2e-cluster suites. Unlike
# test/integration/.chainsaw.yaml, these suites run against the real
# OpenSearch operator (see deploy-provider-e2e), so individual steps
# override these defaults with much longer timeouts while the operator
# actually brings up OpenSearch.
# See https://kyverno.github.io/chainsaw/latest/configuration/ for options.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: e2e-cluster
spec:
  timeouts:
    apply: 60s
    assert: 60s
    delete: 60s
    error: 60s
    exec: 60s
    cleanup: 60s
  cleanup:
    skipDelete: false
  report:
    format: XML
    name: chainsaw-report
    path: /tmp
