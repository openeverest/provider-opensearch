# In-cluster S3 for the e2e backup tests, served over plain HTTP at
# http://seaweedfs.seaweedfs.svc:8333: OpenSearch's repository-s3 has no
# setting to skip TLS verification, and a test CA would have to be added to
# the JVM truststore. Data lives in an emptyDir.
apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          args:
            - mini
            - -dir=/data
            - -webdav=false
            - -admin.ui=false
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -master.telemetry=false
          env:
            - name: S3_BUCKET
              value: backups
            - name: AWS_ACCESS_KEY_ID
              value: seaweedfsadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: seaweedfsadmin
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
