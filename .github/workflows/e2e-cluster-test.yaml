---
# Reusable workflow — run one chainsaw e2e-cluster test suite inside a k3d
# cluster. Unlike integration tests, e2e-cluster tests deploy the real
# OpenSearch operator instead of simulating it (see deploy-provider-e2e).
# Called by ci.yaml; not triggered directly.
name: E2E Cluster test

on:
  workflow_call:
    inputs:
      make_target:
        description: 'Make target for the chainsaw suite (e.g. test-e2e-cluster-core)'
        type: string
        required: true
      suite:
        description: 'Human-readable suite name used for artifact naming'
        type: string
        required: true

permissions:
  contents: read

env:
  IMG: provider-opensearch:ci

jobs:
  run:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Build the platform from the core version go.mod pins, the one whose
      # CRDs install-crds applies: its tag, or the commit of a pseudo-version.
      - name: Resolve OpenEverest ref
        id: openeverest
        run: |
          version=$(awk '$1 == "github.com/openeverest/openeverest/v2" {print $2}' go.mod)
          if [[ "$version" =~ [.-][0-9]{14}-([0-9a-f]{12})$ ]]; then
            # actions/checkout needs the full commit SHA.
            version=$(gh api "repos/openeverest/openeverest/commits/${BASH_REMATCH[1]}" --jq .sha)
          fi
          echo "ref=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout OpenEverest (v2)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: openeverest/openeverest
          ref: ${{ steps.openeverest.outputs.ref }}
          path: _openeverest

      - name: Install Kubernetes tooling
        uses: ./.github/actions/setup-k8s-tools
        with:
          install-k3d: 'true'
          install-chainsaw: 'true'

      - name: Create k3d cluster
        run: |
          sudo modprobe br_netfilter
          make k3d-cluster-up

      - name: Build provider image
        run: make docker-build

      - name: Import image into k3d
        run: make load-image

      - name: Build OpenEverest controller
        working-directory: _openeverest
        run: make build-controller

      - name: Build OpenEverest controller Docker image
        working-directory: _openeverest
        run: make docker-build-controller

      - name: Import OpenEverest controller image into k3d
        run: make load-openeverest-controller-image

      - name: Install CRDs
        run: make install-crds

      - name: Deploy provider with the real OpenSearch operator
        run: make deploy-provider-e2e

      - name: Deploy OpenEverest controller
        working-directory: _openeverest
        run: make deploy-test-controller

      - name: Run ${{ inputs.make_target }}
        run: make ${{ inputs.make_target }}

      - name: Upload chainsaw report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chainsaw-${{ inputs.suite }}-${{ github.run_id }}
          path: /tmp/chainsaw-report*.xml
          retention-days: 7
