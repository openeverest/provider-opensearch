apiVersion: v2
name: provider-opensearch
description: A Helm chart for deploying the OpenEverest provider-opensearch provider
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - openeverest
  - provider
  - database
home: https://github.com/openeverest/provider-opensearch
sources:
  - https://github.com/openeverest/provider-opensearch
maintainers:
  - name: OpenEverest Contributors
dependencies:
  - name: opensearch-operator
    alias: operator
    version: "3.0.14"
    repository: https://opensearch-project.github.io/opensearch-k8s-operator/
    condition: operator.enabled
