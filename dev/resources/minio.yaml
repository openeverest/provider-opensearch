# Minimal S3-compatible deployment for local backup/restore testing.
#
# Deployed by dev/Tiltfile when ENABLE_MINIO=true. Exposes an S3-compatible
# endpoint at http://minio.minio.svc.cluster.local:9000.
#
# Uses adobe/s3mock rather than MinIO: quay.io/minio/minio no longer serves
# the :latest tag to anonymous pulls (401 Unauthorized as of 2026-11), and
# minio/minio is no longer published to Docker Hub at all. s3mock is a
# lightweight, license-free S3 mock with no such restriction, and creates
# its buckets via the initialBuckets env var instead of an init container.
# Data is in-memory and does not survive a pod restart — fine for local
# backup/restore testing, not meant to persist anything real.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
  labels:
    name: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: s3mock
          image: adobe/s3mock:latest
          env:
            - name: initialBuckets
              value: backups
          ports:
            - name: s3
              containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: s3
      protocol: TCP
      port: 9000
      targetPort: 9090
