apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: a-name-that-is-longer-than-thirty-six-characters
spec:
  providerRef:
    name: opensearch
  components:
    engine:
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4Gi
      storage:
        size: 10Gi
