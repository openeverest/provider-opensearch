apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example
spec:
  providerRef:
    name: opensearch
  parameters:
    tls:
      issuer:
        name: ca
        kind: ClusterIssuer
      additionalNames:
        - 10.0.0.1
        - Not_A_Name
  components:
    engine:
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4Gi
      storage:
        size: 10Gi
