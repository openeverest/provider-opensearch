apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example
spec:
  providerRef:
    name: opensearch
  components:
    engine:
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4Gi
      storage:
        size: 10Gi
  backup:
    enabled: true
    classRef:
      name: opensearch-snapshot
    storages:
      - storageRef:
          name: s3
        schedules:
          - name: Daily_Full
            enabled: true
            cron: "0 2 * * *"
